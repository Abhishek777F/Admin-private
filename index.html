<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Private Community Admin</title>
<meta name="color-scheme" content="dark light">
<script>
/* Apply saved theme before first paint (no flash) */
(function(){
  var pref = 'system';
  try { pref = localStorage.getItem('pc-theme') || 'system'; } catch(e){}
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-pref', pref);
  ['accent','density','fs','motion'].forEach(function(k){ try { var v = localStorage.getItem('pc-' + k); if (v) document.documentElement.setAttribute('data-' + k, v); } catch(e){} });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09050F; --s2:#160A24; --card:#21102F; --card2:#2a1640;
  --line:rgba(184,169,201,.14); --tx:#FFFFFF; --tx2:#B8A9C9;
  --p:#7C3AED; --p2:#A855F7; --pink:#F0A6D7;
  --ok:#22C55E; --bad:#F43F5E; --warn:#F59E0B; --info:#38BDF8;
  --grad:linear-gradient(135deg,#7C3AED 0%,#A855F7 55%,#F0A6D7 130%);
  --shadow:0 12px 34px rgba(0,0,0,.35);
  --glow:0 0 0 1px rgba(168,85,247,.25),0 10px 30px rgba(124,58,237,.25);
  --sw:268px; --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --f-head:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#F6F1FB; --s2:#FFFFFF; --card:#FFFFFF; --card2:#F3EAFB;
  --line:rgba(60,20,100,.12); --tx:#1B0B2E; --tx2:#6B5B7F;
  --shadow:0 10px 28px rgba(80,30,140,.12);
  --glow:0 0 0 1px rgba(124,58,237,.22),0 10px 26px rgba(124,58,237,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-head);font-weight:600;letter-spacing:-.01em}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}

/* ---------- Login ---------- */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safe-t)) 18px calc(20px + var(--safe-b));position:relative;overflow:hidden;
  background:linear-gradient(145deg,#2a0f55 0%,#6d28d9 38%,#c77dd6 72%,#F0A6D7 100%)}
.blob{position:absolute;border-radius:42% 58% 63% 37%/45% 40% 60% 55%;filter:blur(2px);opacity:.55}
.blob.a{width:340px;height:340px;left:-110px;top:-90px;background:linear-gradient(135deg,#F0A6D7,#A855F7)}
.blob.b{width:300px;height:300px;right:-90px;bottom:-80px;background:linear-gradient(135deg,#7C3AED,#F0A6D7);border-radius:60% 40% 30% 70%/60% 30% 70% 40%}
.blob.c{width:140px;height:140px;right:12%;top:12%;background:rgba(255,255,255,.28);border-radius:50%}
.lcard{position:relative;width:100%;max-width:410px;padding:30px 24px 24px;border-radius:28px;color:#fff;
  background:rgba(18,7,32,.58);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 70px rgba(20,5,40,.5);animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.5);flex:none}
.brand b{font-family:var(--f-head);font-size:17px;display:block}
.brand small{color:rgba(255,255,255,.7);font-size:12.5px}
.lcard h1{font-size:25px;margin-bottom:4px}
.lcard p.sub{color:rgba(255,255,255,.72);margin-bottom:20px}
.field{position:relative;margin-bottom:13px}
.field>span{position:absolute;left:14px;top:25px;transform:translateY(-50%);display:flex;color:rgba(255,255,255,.65);pointer-events:none}
.field input{width:100%;height:50px;border-radius:14px;padding:0 46px 0 44px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;transition:.2s}
.field input::placeholder{color:rgba(255,255,255,.5)}
.field input:focus{outline:none;border-color:#F0A6D7;background:rgba(255,255,255,.16);box-shadow:0 0 0 4px rgba(240,166,215,.22)}
.field .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;color:rgba(255,255,255,.75);border-radius:10px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px;font-size:13.5px;color:rgba(255,255,255,.8)}
.lrow label{display:flex;align-items:center;gap:8px;cursor:pointer}
.lrow input{accent-color:#A855F7;width:17px;height:17px}
.linkbtn{color:#F0A6D7;font-weight:600;font-size:13.5px;padding:6px 0}
.inline-err{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.45);color:#ffd5dd;font-size:13.5px;margin-bottom:14px}
.inline-err.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.45);color:#c9f7da}
.inline-err .ic{width:18px;height:18px;margin-top:1px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:700;transition:transform .15s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.4)}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:linear-gradient(135deg,#F43F5E,#e11d74);color:#fff;box-shadow:0 8px 22px rgba(244,63,94,.35)}
.btn.sm{height:38px;padding:0 13px;font-size:13.5px;border-radius:12px}
.btn.block{width:100%}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--tx2);transition:.2s}
.icon-btn:hover{background:var(--card2);color:var(--tx)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100dvh;transition:grid-template-columns .25s}
#app.collapsed{--sw:84px}
.side{position:sticky;top:0;height:100dvh;background:var(--s2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;gap:14px;z-index:40;overflow:hidden}
.side .top{display:flex;align-items:center;gap:11px;min-height:44px}
.side .top b{font-family:var(--f-head);font-size:16px;white-space:nowrap}
.side .top .icon-btn{margin-left:auto}
.me{position:relative;display:flex;gap:11px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:.2s}
.me:hover{box-shadow:var(--glow)}
.me .t{min-width:0;flex:1}
.me .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .t small{display:block;color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:99px;background:rgba(168,85,247,.2);color:var(--p2);font-size:11.5px;font-weight:700}
[data-theme="light"] .badge{color:var(--p)}
nav.menu{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;padding-right:2px}
nav.menu a{display:flex;align-items:center;gap:13px;height:46px;padding:0 14px;border-radius:14px;color:var(--tx2);font-weight:600;white-space:nowrap;transition:.2s}
nav.menu a:hover{background:var(--card2);color:var(--tx)}
nav.menu a.on{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.35)}
#app.collapsed .side .top b,#app.collapsed .me .t,#app.collapsed nav.menu a span{display:none}
#app.collapsed .me{padding:8px;justify-content:center}
#app.collapsed nav.menu a{justify-content:center;padding:0}
#app.collapsed .side .top{flex-direction:column;align-items:center;gap:6px}
#app.collapsed .side .top .icon-btn{margin:0}
.av{position:relative;width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.sm{width:36px;height:36px;font-size:13px}
.av.lg{width:76px;height:76px;font-size:26px}
.main{min-width:0;padding:0 0 40px}
.topbar{display:none}
.content{max-width:1180px;margin:0 auto;padding:26px 28px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.page-head h1{font-size:25px}
.page-head p{color:var(--tx2);font-size:14px;margin-top:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx2)}
.search input,.inp{width:100%;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px 0 42px;transition:.2s}
.inp{padding:0 14px}
textarea.inp{height:auto;padding:12px 14px;min-height:84px;resize:vertical}
.search input:focus,.inp:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 4px rgba(168,85,247,.18)}
.lbl{display:block;font-size:13px;color:var(--tx2);font-weight:600;margin:12px 0 6px}

/* ---------- Cards / lists ---------- */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:16.5px;margin-bottom:12px}
.stat{position:relative;overflow:hidden;display:block;transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--glow)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--grad);opacity:.16}
.stat .ico{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff;margin-bottom:12px;box-shadow:0 8px 20px rgba(124,58,237,.35)}
.stat b{display:block;font-family:var(--f-head);font-size:30px;line-height:1.1}
.stat span{color:var(--tx2);font-size:13.5px}
.stat small{display:block;margin-top:4px;color:var(--warn);font-size:12px;font-weight:600}
.hello{background:var(--grad);color:#fff;border:0;margin-bottom:14px;position:relative;overflow:hidden}
.hello h1{font-size:24px}
.hello p{opacity:.9;margin-top:4px;max-width:540px}
.hello .sh{position:absolute;right:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.18)}
.row{display:flex;gap:13px;align-items:center;padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:.2s}
.row:hover{border-color:rgba(168,85,247,.45)}
.row .body{min-width:0;flex:1}
.row .body b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .body .s{color:var(--tx2);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.row .body .m{color:var(--tx2);font-size:12px;margin-top:3px;opacity:.9;word-break:break-all}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .thumb{width:62px;height:62px;border-radius:14px;object-fit:cover;background:var(--card2);flex:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(168,85,247,.18);color:var(--p2);margin-left:6px;vertical-align:1px}
.pill.ok{background:rgba(34,197,94,.16);color:var(--ok)}
.pill.bad{background:rgba(244,63,94,.16);color:var(--bad)}
.pill.warn{background:rgba(245,158,11,.18);color:var(--warn)}
.state{text-align:center;padding:46px 18px;color:var(--tx2);border:1px dashed var(--line);border-radius:var(--r)}
.state .ic{width:34px;height:34px;color:var(--p2);margin-bottom:8px}
.state h3{color:var(--tx);margin-bottom:4px}
.state .btn{margin-top:14px}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;margin-top:8px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:10px;font-size:13.5px}
.bar .tr{height:12px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:var(--grad);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.note{color:var(--tx2);font-size:12.5px;margin-top:12px}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.shortcuts a{display:flex;gap:9px;align-items:center;padding:12px;border-radius:14px;background:var(--card2);font-weight:600;font-size:14px;transition:.2s}
.shortcuts a:hover{box-shadow:var(--glow)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:14px}
.kv dt{color:var(--tx2)} .kv dd{word-break:break-word}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:46px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent}
.chk{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;cursor:pointer}
.chk:hover{background:var(--card2)}
.chk input{accent-color:#A855F7;width:19px;height:19px}
.pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:4px}

/* ---------- Mobile nav ---------- */
.bnav{display:none}
.scrim{display:none}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,300px);transform:translateX(-102%);transition:transform .28s;padding-top:calc(16px + var(--safe-t));padding-bottom:calc(16px + var(--safe-b));box-shadow:var(--shadow)}
  #app.collapsed .side .top b,#app.collapsed .me .t,#app.collapsed nav.menu a span{display:revert}
  #app.collapsed .side{--sw:auto}
  #app.collapsed .me{padding:12px;justify-content:flex-start}
  #app.collapsed nav.menu a{justify-content:flex-start;padding:0 14px}
  #app.collapsed .side .top{flex-direction:row;align-items:center}
  #app.collapsed .side .top .icon-btn{margin-left:auto}
  #app.open .side{transform:none}
  #app.open .scrim{display:block;position:fixed;inset:0;background:rgba(5,2,10,.6);z-index:35}
  #collapseBtn{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;padding:calc(10px + var(--safe-t)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar b{font-family:var(--f-head);flex:1}
  .content{padding:18px 14px calc(96px + var(--safe-b))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s2);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--tx2);font-size:11.5px;font-weight:600}
  .bnav .on{color:var(--p2)}
  .row{flex-wrap:wrap}.row .acts{width:100%;justify-content:flex-start}
  .kv{grid-template-columns:96px 1fr}
}

/* ---------- Modal / toast ---------- */
.mback{position:fixed;inset:0;z-index:100;background:rgba(5,2,10,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--safe-t)) 14px calc(16px + var(--safe-b));animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.modal{width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;border-radius:24px;background:color-mix(in srgb,var(--s2) 94%,transparent);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .22s ease both;overflow:hidden}
.modal.wide{max-width:640px}
.mhead{display:flex;align-items:center;gap:8px;padding:16px 16px 6px 20px}
.mhead h3{flex:1;font-size:18px}
.mbody{padding:8px 20px 14px;overflow-y:auto;overscroll-behavior:contain}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 18px}
.mfoot:empty{display:none}
.merr{display:flex;gap:9px;padding:10px 12px;border-radius:12px;background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.4);color:var(--bad);font-size:13.5px;margin-top:12px}
[data-theme="light"] .merr{color:#be123c}
.dname{display:inline-block;margin:8px 0;padding:8px 12px;border-radius:12px;background:var(--card2);font-weight:700;word-break:break-word}
.media{width:100%;max-height:340px;border-radius:16px;object-fit:contain;background:#000;margin-bottom:12px}
.pop{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.pop button{display:flex;gap:11px;align-items:center;width:100%;padding:11px 12px;border-radius:11px;font-weight:600;text-align:left}
.pop button:hover{background:var(--card2)}
.pop .out{color:var(--bad)}
#toasts{position:fixed;z-index:200;left:12px;right:12px;bottom:calc(86px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media (min-width:901px){#toasts{left:auto;right:22px;bottom:22px;align-items:flex-end}}
.toast{pointer-events:auto;display:flex;gap:11px;align-items:center;max-width:420px;width:100%;padding:12px 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .22s ease both;font-size:14px}
.toast .ic{width:20px;height:20px}
.toast.success .ic{color:var(--ok)} .toast.error .ic{color:var(--bad)} .toast.warning .ic{color:var(--warn)} .toast.info .ic{color:var(--info)}
.toast .spin{border-color:rgba(168,85,247,.3);border-top-color:var(--p2)}
.toast span{flex:1;word-break:break-word}
button{touch-action:manipulation}
.modal:focus{outline:none}
.modal.full{max-width:none}
@media (max-width:700px){.modal.full{height:100%;border-radius:0}.mback:has(.modal.full){padding:0}}
.av img,img.thumb,img.media,[data-video]{cursor:zoom-in}
.viewer{position:fixed;inset:0;z-index:150;background:#000;display:flex;align-items:center;justify-content:center;animation:fade .15s ease both}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.vx{position:absolute;top:calc(12px + var(--safe-t));right:12px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;z-index:2}
.wk{display:flex;gap:8px;align-items:flex-end;height:150px}

</section>

<!-- ================= APP ================= -->

  <main class="main">

</div>

};
const ic = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n] || ""}"/></svg>`;
const pick = (o, keys) => { for (const k of keys) { const v = o?.[k]; if (v !== undefined && v !== null && String(v).trim() !== "") return v; } return ""; };
const toDate = t => t?.toDate ? t.toDate() : (t?.seconds ? new Date(t.seconds * 1000) : (t ? new Date(t) : null));
const fmt = t => { const d = toDate(t); return d && !isNaN(d) ? d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—"; };
const num = n => n === null || n === undefined ? "—" : Number(n).toLocaleString();
const initials = n => (String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("") || "?").toUpperCase();
const avatar = (name, url, cls = "") => `<span class="av ${cls}">${esc(initials(name))}${url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;

const uPhoto = u => pick(u, ["profilePhoto", "photoURL", "photo", "profilePic", "profileImage", "avatar", "imageUrl"]);
const isVideo = u => /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u) || /\/video\/upload\//.test(u);
const skeleton = (n = 4, h = 70) => Array.from({ length: n }, () => `<div class="sk" style="height:${h}px;margin-bottom:10px"></div>`).join("");
const errText = e => e?.code === "permission-denied" ? "Firestore rules blocked this request for your admin account." : (e?.message || "Something went wrong.");
const userCache = new Map();
async function getUser(uid) {
  if (!uid) return null;
  if (userCache.has(uid)) return userCache.get(uid);
  let u = null;
  try { const s = await getDoc(doc(db, "users", uid)); u = s.exists() ? { id: uid, ...s.data() } : null; } catch (e) { u = null; }
  userCache.set(uid, u); return u;
}
async function pageDocs(base, field, cursor, size = 20) {
  const c = cursor ? [startAfter(cursor)] : [];
  try { return (await getDocs(query(base, orderBy(field, "desc"), ...c, limit(size)))).docs; }
  catch (e) { if (e.code === "permission-denied") throw e; return (await getDocs(query(base, orderBy(documentId()), ...c, limit(size)))).docs; }
}
async function delAll(colRef) {
  for (;;) {
    const s = await getDocs(query(colRef, limit(300)));
    if (s.empty) return;
    const b = writeBatch(db); s.docs.forEach(d => b.delete(d.ref)); await b.commit();
  }
}
const primitives = o => Object.entries(o).filter(([k, v]) => !k.startsWith("_") && v !== null && typeof v !== "object" || v?.toDate).map(([k, v]) => [k, v?.toDate ? fmt(v) : String(v)]);
const kv = rows => `<dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;

/* ---------- Toasts ---------- */
const TI = { success: "check", error: "alert", warning: "alert", info: "info" };
function toast(type, msg, { loading = false, ms = 4200 } = {}) {
  const el = document.createElement("div"); el.className = `toast ${type}`; el.setAttribute("role", type === "error" ? "alert" : "status");
  const paint = (t, m, l) => { el.className = `toast ${t}`; el.innerHTML = `${l ? '<div class="spin"></div>' : ic(TI[t] || "info")}<span>${esc(m)}</span>`; };
  paint(type, msg, loading); $("#toasts").appendChild(el);
  let timer = null; const close = () => { clearTimeout(timer); el.remove(); };
  if (!loading) timer = setTimeout(close, ms);
  return { close, update(t, m) { paint(t, m, false); clearTimeout(timer); timer = setTimeout(close, ms); } };
}

/* ---------- Modal system ---------- */
const stack = [];
function modal({ title, html = "", node = null, actions = [], wide = false, full = false, dismiss = true, backdrop = true, beforeClose = null }) {
  const prev = document.activeElement;
  const back = document.createElement("div"); back.className = "mback";
  back.innerHTML = `<div class="modal ${wide ? "wide" : ""} ${full ? "full" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mhead"><h3>${esc(title)}</h3><button class="icon-btn" data-x aria-label="Close dialog">${ic("x")}</button></div><div class="mbody"></div><div class="mfoot"></div></div>`;
  const body = $(".mbody", back), foot = $(".mfoot", back);
  if (node) body.appendChild(node); else body.innerHTML = html;
  let busy = false, done; const closed = new Promise(r => done = r);
  const api = { el: back, body, closed, get busy() { return busy; },
    error(msg) { $(".merr", body)?.remove(); if (msg) body.insertAdjacentHTML("beforeend", `<div class="merr" role="alert">${ic("alert")}<span>${esc(msg)}</span></div>`); },
    setBusy(b, btn) { busy = b; back.querySelectorAll("button").forEach(x => { x.disabled = b; }); btn?.querySelector(".spin")?.remove(); if (b && btn) btn.insertAdjacentHTML("afterbegin", '<div class="spin"></div>'); },
    async close(force = false) {
      if (busy) return;
      if (!force && beforeClose && !(await beforeClose())) return;
      const i = stack.indexOf(api); if (i > -1) stack.splice(i, 1);
      back.remove(); done(); try { prev?.focus?.(); } catch (e) {}
    } };
  actions.forEach(a => {
    const b = document.createElement("button"); b.type = "button"; b.className = `btn ${a.kind || "ghost"}`; b.textContent = a.label; if (a.aria) b.setAttribute("aria-label", a.aria);

  back.addEventListener("keydown", e => {
    if (e.key === "Tab") { const f = [...back.querySelectorAll("button:not([disabled]),input,textarea,select,[tabindex]")].filter(x => x.offsetParent); if (!f.length) return; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }

  return new Promise(res => {

    const m = modal({ title, backdrop: false, html: `${name ? `<div class="dname">${esc(name)}</div>` : ""}<p style="color:var(--tx2)">${text}</p>`,

  console.error(e);

/* ---------- Static icons ---------- */
$("#loginLogo").innerHTML = $("#sideLogo").innerHTML = ic("layers");
$("#icMail").innerHTML = ic("mail"); $("#icLock").innerHTML = ic("lock");

/* ---------- Auth state ---------- */
let me = null, adminDoc = null, myUser = null, unsubAdmin = null, loginNotice = null, idleTimer = null;

function showLogin() {
  show("login"); $("#loginForm").reset(); $("#loginMsg").innerHTML = "";

function setLoginMsg(text, ok = false) { $("#loginMsg").innerHTML = text ? `<div class="inline-err ${ok ? "ok" : ""}" role="alert">${ic(ok ? "check" : "alert")}<span>${esc(text)}</span></div>` : ""; }

  try {
    const s = await getDoc(doc(db, "admins", u.uid));

    if (s.data().active !== true) return { ok: false, why: "This administrator account is not active." };

  if (!v.ok) { loginNotice = { text: v.why }; await signOut(auth); return; }

    if (!s.exists() || s.data().active !== true) { loginNotice = { text: "Your administrator access was revoked." }; signOut(auth); }

  } catch (err) {

function resizeToDataURL(file, max = 400) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That image could not be read. Try a different photo.")); };
    img.src = url;
  });
}
/* Photos are resized in the browser and kept as small data URLs: no cloud storage service. */
function shrinkImage(file, max = 320) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height), size = Math.min(max, side);
      const c = document.createElement("canvas"); c.width = c.height = size;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, size, size);
      x.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      const out = c.toDataURL("image/jpeg", 0.82);
      out.length > 200000 ? rej(new Error("That photo is too large even after shrinking. Choose another.")) : res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That image could not be read.")); };
    img.src = url;
  });
}

function memberPicker(sel, exclude = []) {

  const shown = () => { const q = $(".mpSearch", node).value.trim().toLowerCase(); return users.filter(u => !exclude.includes(u.id) && (!q || [uName(u), u.email, u.id].join(" ").toLowerCase().includes(q))); };
  const paint = () => { $(".mpList", node).innerHTML = shown().map(u => `<label class="chk"><input type="checkbox" data-u="${esc(u.id)}" ${sel.has(u.id) ? "checked" : ""}>${avatar(uName(u), uPhoto(u), "sm")}<span style="min-width:0"><b style="display:block">${esc(uName(u))}</b><small style="color:var(--tx2)">${esc(u.email || "")}</small></span></label>`).join("") || `<p class="note" style="padding:12px">No members found.</p>`; };

  const mp = memberPicker(sel); $("#anPick", n).appendChild(mp.node);
  n.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; n.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("on", x === b)); $("#anPick", n).classList.toggle("hide", mode !== "sel"); $("#anNote", n).textContent = mode === "all" ? "Every member will receive this notification." : "Only the members you select will receive it."; });
  modal({ title: "Send announcement", node: n, wide: true, actions: [{ label: "Cancel" }, { label: "Send", kind: "primary", run: async () => {
    const title = $("#anT", n).value.trim(), message = $("#anM", n).value.trim();
    if (!title) throw new Error("Enter a title."); if (!message) throw new Error("Enter a message.");
    let ids = [...sel];
    if (mode === "all") ids = (await getDocs(query(collection(db, "users"), limit(2000)))).docs.map(d => d.id);
    if (!ids.length) throw new Error("Select at least one member.");
    for (let i = 0; i < ids.length; i += 400) {
      const b = writeBatch(db);
      ids.slice(i, i + 400).forEach(uid => b.set(doc(collection(db, "notifications")), { recipientId: uid, title, message, type: "announcement", read: false, createdAt: serverTimestamp(), from: me.uid }));
      await b.commit();
    }
    toast("success", `Announcement sent to ${ids.length} member${ids.length === 1 ? "" : "s"}`); if (location.hash === "#notifications") reload();
  } }] });
}

/* Notifications */
views.notifications = listView({
  title: "Notifications", sub: "Notifications sent to members.", tools: `<button class="btn primary sm" id="sendAnn">${ic("send")} Send announcement</button>`, setup: root => { $("#sendAnn", root).onclick = announceDialog; }, ph: "Search title, message or recipient", empty: "No notifications", emptySub: "Nothing found, or the collection does not exist yet.",
  fetch: c => pageDocs(collection(db, "notifications"), "createdAt", c),
  enrich: async n => { n._to = uName(await getUser(n.recipientId)); },
  text: n => [n.title, n.message, n._to, n.id].join(" "),
  row: n => `<div class="row"><div class="av">${ic("bell")}</div><div class="body"><b>${esc(n.title || "Notification")}${n.read === false ? '<span class="pill warn">Unread</span>' : ""}</b><div class="s">${esc(n.message || "")}</div><div class="m">To ${esc(n._to)} • ${fmt(n.createdAt)} • ${esc(n.id)}</div></div><div class="acts">${act("del", n.id, "Delete notification", "trash", "danger")}</div></div>`,
  act(a, n, ctl) { confirmDialog({ title: "Delete this notification?", name: n.title || n.id, label: "Delete notification", text: "It is permanently removed from the recipient's notifications.", run: async () => { await deleteDoc(n.ref); } }).then(ok => { if (ok) { toast("success", "Notification deleted"); ctl.remove(n.id); } }); }
});

/* Settings */
const APP_VERSION = "2.2";
const PREF_DEFAULT = { accent: "purple", density: "comfortable", fs: "md", motion: "on", idle: "0" };
const getPref = k => { try { return localStorage.getItem("pc-" + k) || PREF_DEFAULT[k]; } catch (e) { return PREF_DEFAULT[k]; } };
function setPref(k, v) { try { localStorage.setItem("pc-" + k, v); } catch (e) {} if (k === "idle") armIdle(); else document.documentElement.setAttribute("data-" + k, v); }
const ACCENTS = [["purple", "#A855F7"], ["blue", "#38BDF8"], ["pink", "#F472B6"], ["emerald", "#34D399"], ["orange", "#FB923C"]];
const shortDate = t => { const d = t ? new Date(t) : null; return d && !isNaN(d) ? d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "—"; };

/* My profile page */
views.profile = async root => {
  let mine = null;
  try { mine = (await getCountFromServer(query(collection(db, "posts"), where("uid", "==", me.uid)))).data().count; } catch (e) {}
  const role = pick(adminDoc, ["role"]) || "Admin";
  root.innerHTML = `<div class="card hello" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span class="sh"></span>${avatar(adminName(), adminPhoto(), "lg")}<div style="min-width:0;position:relative"><h1>${esc(adminName())}</h1><p style="margin:2px 0 8px;word-break:break-all">${esc(me.email)}</p><span class="badge" style="background:rgba(255,255,255,.25);color:#fff">${esc(role)}</span></div></div>
  <div class="grid stats" style="margin-bottom:14px">
    <div class="card stat"><div class="ico">${ic("image")}</div><b>${num(mine)}</b><span>Posts by you</span></div>
    <div class="card stat"><div class="ico">${ic("user")}</div><b style="font-size:17px;padding-top:6px">${esc(shortDate(me.metadata?.creationTime).split(",").slice(0, 2).join(","))}</b><span>Account created</span></div>
    <div class="card stat"><div class="ico">${ic("lock")}</div><b style="font-size:17px;padding-top:6px">${me.emailVerified ? "Verified" : "Not verified"}</b><span>Email status</span></div>
  </div>
  <div class="grid two"><div class="card"><h2>Account</h2>${kv([["Name", adminName()], ["Email", me.email], ["Role", role], ["Status", adminDoc?.active === true ? "Active admin" : "Inactive"], ["Last sign-in", shortDate(me.metadata?.lastSignInTime)], ["UID", me.uid]])}<button class="btn ghost sm" id="pCopy" style="margin-top:12px">Copy UID</button></div>
  <div class="card"><h2>Manage</h2><div style="display:grid;gap:10px"><button class="btn ghost" id="pEdit">${ic("edit")} Edit name and photo</button><button class="btn ghost" id="pPw">${ic("lock")} Change password</button><a class="btn ghost" href="#settings">${ic("settings")} Open settings</a><button class="btn danger" id="pOut">${ic("logout")} Sign out</button></div><p class="note">Tap your photo to view it full screen.</p></div></div>`;
  $("#pEdit", root).onclick = editProfile; $("#pPw", root).onclick = passwordDialog; $("#pOut", root).onclick = signOutDialog;
  $("#pCopy", root).onclick = async () => { try { await navigator.clipboard.writeText(me.uid); toast("success", "UID copied"); } catch (e) { toast("info", me.uid); } };
};

/* Settings */
views.settings = async root => {
  const pref = document.documentElement.getAttribute("data-pref") || "system";
  const seg = (k, opts, cur, cls = "seg") => `<div class="${cls}" data-pref="${k}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${cur === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
  const md = me.metadata || {};
  root.innerHTML = head("Settings", "Personalize the panel and manage your account security.") + `<div class="grid two">
  <div class="card"><h2>Admin profile</h2><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${avatar(adminName(), adminPhoto(), "lg")}<div style="min-width:0"><b>${esc(adminName())}</b><div style="color:var(--tx2);word-break:break-all">${esc(me.email)}</div><span class="badge">${esc(pick(adminDoc, ["role"]) || "Admin")}</span></div></div><div style="display:grid;gap:10px"><a class="btn ghost" href="#profile">${ic("user")} Open my profile</a><button class="btn ghost" id="sEdit">${ic("edit")} Edit name and photo</button></div></div>
  <div class="card"><h2>Appearance</h2>
    <label class="lbl" style="margin-top:0">Theme Colors</label>${seg("theme", [["dark", "Dark purple"], ["light", "Light"], ["system", "System"]], pref)}
    <label class="lbl">Accent color</label><div class="swatches" data-pref="accent">${ACCENTS.map(([v, c]) => `<button type="button" data-v="${v}" class="${getPref("accent") === v ? "on" : ""}" style="background:${c}" aria-label="${v} accent"></button>`).join("")}</div>
    <label class="lbl">Text size</label>${seg("fs", [["sm", "Small"], ["md", "Medium"], ["lg", "Large"]], getPref("fs"))}
    <label class="lbl">Layout density</label>${seg("density", [["comfortable", "Comfortable"], ["compact", "Compact"]], getPref("density"), "seg2")}
    <label class="lbl">Animations</label>${seg("motion", [["on", "On"], ["off", "Reduced"]], getPref("motion"), "seg2")}
    <p class="note">Saved on this device and applied instantly.</p></div>
  <div class="card"><h2>Security</h2>${kv([["Signed in as", me.email], ["Email verified", me.emailVerified ? "Yes" : "No"], ["Account created", shortDate(md.creationTime)], ["Last sign-in", shortDate(md.lastSignInTime)]])}
    <label class="lbl">Auto sign-out when idle</label>${seg("idle", [["0", "Off"], ["15", "15 min"], ["30", "30 min"], ["60", "1 hour"]], getPref("idle"), "seg4")}
    <div style="display:grid;gap:10px;margin-top:14px"><button class="btn ghost" id="sPw">${ic("lock")} Change password</button><button class="btn ghost" id="sReset">${ic("mail")} Email me a reset link</button><button class="btn danger" id="sOut">${ic("logout")} Sign out</button></div>
    <p class="note">Signing out ends this browser's session only. Other devices stay signed in until they sign out.</p></div>
  <div class="card"><h2>Data and store</h2><div style="display:grid;gap:10px"><button class="btn ghost" id="sCache">${ic("refresh")} Refresh cached member data</button><button class="btn ghost" id="sReset2">${ic("trash")} Reset appearance to defaults</button></div><p class="note">These only affect this browser. Nothing in your database is changed.</p></div>
  <div class="card"><h2>About</h2>${kv([["Panel version", APP_VERSION], ["Project", firebaseConfig.projectId], ["Role", pick(adminDoc, ["role"]) || "Admin"], ["Connection", navigator.onLine ? "Online" : "Offline"]])}</div></div>`;
  root.addEventListener("click", e => {
    const b = e.target.closest("[data-pref] [data-v]"); if (!b) return;
    const k = b.closest("[data-pref]").dataset.pref, v = b.dataset.v;
    k === "theme" ? applyTheme(v) : setPref(k, v);
    b.closest("[data-pref]").querySelectorAll("[data-v]").forEach(x => x.classList.toggle("on", x === b));
    toast("success", k === "idle" ? (v === "0" ? "Auto sign-out is off" : `You will be signed out after ${v} minutes idle`) : "Saved");
  });
  $("#sEdit", root).onclick = editProfile; $("#sPw", root).onclick = passwordDialog; $("#sOut", root).onclick = signOutDialog;
  $("#sReset", root).onclick = async () => { try { await sendPasswordResetEmail(auth, me.email); toast("success", "Reset link sent to " + me.email); } catch (e) { toast("error", errText(e)); } };
  $("#sCache", root).onclick = () => { userCache.clear(); toast("success", "Cached data cleared"); };
  $("#sReset2", root).onclick = () => { ["accent", "density", "fs", "motion"].forEach(k => { try { localStorage.getItem("pc-" + k); localStorage.removeItem("pc-" + k); } catch (e) {} document.documentElement.removeAttribute("data-" + k); }); applyTheme("system"); toast("success", "Appearance reset"); route(); };
};

function openViewer(src, video = false) {
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", "Full screen view");
  v.innerHTML = `<button class="vx" aria-label="Close full screen view">${ic("x")}</button>` + (video ? `<video src="${esc(src)}" controls autoplay playsinline></video>` : `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer">`);
  const api = { dismissible: true, busy: false, close() { const i = stack.indexOf(api); if (i > -1) stack.splice(i, 1); v.remove(); } };
  v.addEventListener("click", e => { if (e.target === v || e.target.closest(".vx")) api.close(); });
  document.body.appendChild(v); stack.push(api);
}
document.addEventListener("click", e => {
  const vid = e.target.closest("[data-video]"); if (vid) return openViewer(vid.dataset.video, true);
  const img = e.target.closest(".av img, img.thumb, img.media"); if (!img || img.closest(".me,.topbar,label,.bnav,.viewer")) return;
  openViewer(img.currentSrc || img.src);
});
if (CONFIG_MISSING) { showLogin(); }
</script>
